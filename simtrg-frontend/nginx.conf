# ============================================================
# NGINX - SIMTRG Frontend
# Sirve los assets estáticos de React y reenvía /api y /uploads
# al backend (mismo rol que el proxy de Vite en desarrollo, para
# que el frontend siga usando rutas relativas sin cambios).
# ============================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Subir el límite de tamaño de body para las cargas de fotos
    client_max_body_size 60M;

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
    }

    # SPA: cualquier ruta que no sea un archivo real cae en index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los assets con hash en el nombre (JS/CSS de la build) pueden
    # cachearse agresivamente sin riesgo de servir versiones viejas.
    location ~* \.(?:js|css|svg|png|jpg|jpeg|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
